<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RealWage OG image (1200×630)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <!-- Screenshot this page at exactly 1200×630 to produce og-image.png -->
  <style>
    html, body { margin: 0; }
    body { width: 1200px; height: 630px; overflow: hidden; background: #ffffff; font-family: Inter, sans-serif; color: #1a1b1e; }
    .wrap { position: relative; box-sizing: border-box; height: 100%; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
    .bar { position: absolute; top: 0; left: 0; right: 0; height: 14px; background: #E5484D; }
    .brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 30px; letter-spacing: -.01em; }
    h1 { margin: 0; font-size: 92px; line-height: 1.02; font-weight: 800; letter-spacing: -.045em; max-width: 1000px; }
    h1 span { color: #E5484D; }
    .row { display: flex; align-items: flex-end; justify-content: space-between; }
    .sub { font-size: 32px; font-weight: 600; color: #5f636a; }
    .compare { display: flex; align-items: baseline; gap: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .old { font-size: 44px; color: #9a9da3; text-decoration: line-through; text-decoration-color: #E5484D; text-decoration-thickness: 5px; }
    .new { font-size: 72px; color: #E5484D; letter-spacing: -.03em; }
    .new small { font-size: 30px; color: #5f636a; font-weight: 600; letter-spacing: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar"></div>
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#E5484D"/><circle cx="32" cy="32" r="20" fill="none" stroke="#fff" stroke-width="5"/><path d="M32 19v13l9 6" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      RealWage
    </div>
    <h1>What do you <span>REALLY</span> earn per hour?</h1>
    <div class="row">
      <div class="sub">Your salary lies. Count the commute,<br>overtime and costs.</div>
      <div class="compare"><span class="old">¥1,488</span><span class="new">¥900<small>/hour</small></span></div>
    </div>
  </div>
</body>
</html>
